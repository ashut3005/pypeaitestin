name: Deploy Frontend to EC2 Prod Blue Green

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: whispey-frontend-prod

jobs:
  test:
    name: Test and Build Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build application
        run: npm run build

  docker-build-push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image details
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

          echo "IMAGE_URI=${IMAGE_URI}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
              --username AWS \
              --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Build Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "${IMAGE_URI}" \
            frontend

      - name: Push Docker image
        run: |
          docker push "${IMAGE_URI}"

  deploy:
    name: Deploy to Private EC2 using Blue Green
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: production

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger blue green deployment through SSM
        run: |
          IMAGE_URI="${{ needs.docker-build-push.outputs.image_uri }}"
          IMAGE_TAG="${{ needs.docker-build-push.outputs.image_tag }}"
          INSTANCE_ID="${{ secrets.PROD_PRIVATE_INSTANCE_ID }}"

          echo "IMAGE_URI=${IMAGE_URI}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "INSTANCE_ID=${INSTANCE_ID}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Frontend deployment" \
            --parameters commands='[
              "sudo /opt/frontend/deploy.sh '"${IMAGE_URI}"' '"${IMAGE_TAG}"'"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          RESULT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}")

          STATUS=$(echo "${RESULT}" | jq -r '.StatusDetails')
          STDOUT=$(echo "${RESULT}" | jq -r '.StandardOutputContent')
          STDERR=$(echo "${RESULT}" | jq -r '.StandardErrorContent')

          echo "===== STDOUT ====="
          echo "${STDOUT}"

          echo "===== STDERR ====="
          echo "${STDERR}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment failed"
            exit 1
          fi

          echo "Deployment successful"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run Health Check
        run: |
          INSTANCE_ID="${{ secrets.PROD_PRIVATE_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "curl -I http://127.0.0.1/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          echo "Health check completed"
