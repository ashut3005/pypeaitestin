<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Web Pages new changes new dosdkne</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #466e8b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      padding: 40px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #0077cc;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #005fa3;
    }

    footer {
      margin-top: 40px;
      padding: 15px;
      text-align: center;
      background: #222;
      color: #ccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Everything done new changes</h1>
  </header>

  <main>
    <h2>Hello World!</h2>
    <p>fix the bug.</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </main>

  <footer>
    &copy; 2026 My Website
  </footer>

  <script>
    function showMessage() {
      alert("Button clicked!");
    }
  </script>

</body>
</html>
